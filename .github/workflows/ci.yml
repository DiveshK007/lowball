name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: compile + test contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Compact toolchain
        run: compact update

      - name: Install dependencies
        run: npm install --prefix contract

      - name: Compile Compact contract
        run: npm run compact --prefix contract

      - name: Run test suite
        run: npm test --prefix contract
