name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: compile + test contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Compact toolchain
        # Pinned. A bare `compact update` takes the newest toolchain, and 0.34.0
        # emits contracts that require @midnight-ntwrk/compact-runtime 0.19.x
        # while contract/package.json pins ^0.16.0 — which broke every CI run
        # after 2026-08-24 with "Version mismatch: compiled code expects 0.19.0,
        # runtime is 0.16.0". Move this and compact-runtime together, never one
        # alone.
        run: compact update 0.31.1

      - name: Install dependencies
        run: npm install --prefix contract

      - name: Compile Compact contract
        run: npm run compact --prefix contract

      - name: Run test suite
        run: npm test --prefix contract

  web:
    name: build + test web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --prefix web

      # Covers the receipts page's commitment maths, which is asserted against
      # a commitment the chain has already accepted (see hashes.test.ts).
      - name: Run test suite
        run: npm test --prefix web

      - name: Production build
        run: npm run build --prefix web
